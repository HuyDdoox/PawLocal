<section class="section section-quick-actions">
  <div class="section-title-wrap">
    <h2 class="section-title">Danh mục sản phẩm</h2>
    <span class="section-sub">Chọn nhanh ngành hàng cho Boss cưng</span>
  </div>

  <div class="quick-grid">
    @for (cat of productService.categories(); track cat.id) {
      <a [routerLink]="['/category', cat.slug || cat.id]" class="quick-item">
        <div class="circle-placeholder">
          <i [class]="(cat.icon || 'fa-solid fa-paw') + ' action-icon'"></i>
        </div>
        <span class="placeholder-label">{{ cat.name }}</span>
      </a>
    } @empty {
      <a routerLink="/products" class="quick-item">
        <div class="circle-placeholder"><i class="fa-solid fa-bowl-food action-icon"></i></div>
        <span class="placeholder-label">Thức Ăn Hạt</span>
      </a>
      <a routerLink="/products" class="quick-item">
        <div class="circle-placeholder"><i class="fa-solid fa-fish action-icon"></i></div>
        <span class="placeholder-label">Pate Thưởng</span>
      </a>
      <a routerLink="/products" class="quick-item">
        <div class="circle-placeholder"><i class="fa-solid fa-baseball action-icon"></i></div>
        <span class="placeholder-label">Đồ Chơi</span>
      </a>
      <a routerLink="/products" class="quick-item">
        <div class="circle-placeholder"><i class="fa-solid fa-soap action-icon"></i></div>
        <span class="placeholder-label">Chăm Sóc</span>
      </a>
    }
  </div>
</section>
