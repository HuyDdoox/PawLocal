<section class="section section-quick-actions">
  <div class="section-title-wrap">
    <h2 class="section-title">Danh mục sản phẩm</h2>
    <span class="section-sub">Chọn nhanh ngành hàng cho Boss cưng</span>
  </div>

  <div class="quick-grid">
    @for (cat of productService.categories(); track cat.id) {
      <a [routerLink]="['/category', cat.slug || cat.id]" class="quick-item">
        <div class="circle-placeholder">
          <i [class]="(cat.icon || 'fa-solid fa-paw') + ' action-icon'"></i>
        </div>
        <span class="placeholder-label">{{ cat.name }}</span>
      </a>
    } @empty {
      <div class="category-loading-note">Đang tải danh mục từ MongoDB...</div>
    }
  </div>
</section>
